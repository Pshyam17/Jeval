<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jeval · Latent Space Navigator</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0a; overflow: hidden; font-family: monospace; }
canvas { display: block; }

#hud {
  position: fixed; top: 20px; left: 20px;
  color: #888; font-size: 11px; line-height: 1.8;
  pointer-events: none; z-index: 50;
}
#hud .logo { color: #ffd166; font-size: 13px; letter-spacing: 2px; margin-bottom: 4px; }
#hud .val { color: #e0e0e0; }
#hud hr { border-color: #222; margin: 4px 0; }

#inspect {
  display: none;
  position: fixed; bottom: 20px; right: 20px;
  width: 320px; background: rgba(10,10,10,0.92);
  border: 1px solid #333; padding: 16px;
  font-size: 12px; color: #ccc; z-index: 100;
  white-space: pre-wrap; word-break: break-word;
}
#inspect .close { position: absolute; top: 8px; right: 12px; cursor: pointer; color: #555; }

#query-bar {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 8px; z-index: 100;
}
#query-input {
  background: #111; border: 1px solid #333; color: #e0e0e0;
  padding: 8px 12px; font-family: monospace; font-size: 12px;
  width: 300px; outline: none;
}
#query-btn {
  background: #ffd166; color: #000; border: none; padding: 8px 16px;
  font-family: monospace; font-size: 12px; cursor: pointer;
}

#query-result {
  display: none;
  position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%);
  width: 560px; max-height: 160px; overflow-y: auto;
  background: rgba(10,10,10,0.95); border: 1px solid #333;
  padding: 12px 14px; font-size: 11px; color: #ccc; z-index: 100;
  white-space: pre-wrap; word-break: break-word; line-height: 1.6;
}
#query-result .qr-label {
  font-size: 9px; letter-spacing: 2px; color: #555; margin-bottom: 6px;
}
#query-result .qr-type {
  font-size: 9px; color: #ffd166; float: right;
}
</style>
</head>
<body>

<div id="hud">
  <div class="logo">JEVAL &nbsp;/&nbsp; LATENT SPACE</div>
  <hr>
  hot cache &nbsp;&nbsp; <span class="val" id="h-hot">0 pts / 0 tok</span><br>
  cold store &nbsp; <span class="val" id="h-cold">0 total</span><br>
  novel rate &nbsp; <span class="val" id="h-novel">--%</span><br>
  <hr>
  session: <span class="val" id="h-session">-</span>
</div>

<div id="inspect">
  <span class="close" id="inspect-close">✕</span>
  <span id="inspect-content"></span>
</div>

<div id="query-result">
  <span class="qr-label">MEMORY RESULT</span>
  <span class="qr-type" id="qr-type"></span>
  <div id="qr-text"></div>
</div>

<div id="query-bar">
  <input id="query-input" type="text" placeholder="ask the memory...">
  <button id="query-btn" onclick="sendQuery()">retrieve</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ── scene setup ───────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 1000);
camera.position.set(0, 5, 12);
camera.lookAt(0, 0, 0);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

scene.add(new THREE.AmbientLight(0xffffff, 0.3));
const ptLight = new THREE.PointLight(0xffffff, 0.8);
ptLight.position.set(10, 10, 10);
scene.add(ptLight);

const grid = new THREE.GridHelper(20, 20, 0x1a1a1a, 0x1a1a1a);
scene.add(grid);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── state ─────────────────────────────────────────────────────────────────────
const points = {};          // seq_id → { mesh, data, position }
const animations = [];      // active tween-like objects
let novelCount = 0;
let totalCount = 0;

// ── animation loop ────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  controls.update();

  const now = performance.now();
  for (let i = animations.length - 1; i >= 0; i--) {
    const done = animations[i](now);
    if (done) animations.splice(i, 1);
  }
  renderer.render(scene, camera);
}
animate();

// ── helpers ───────────────────────────────────────────────────────────────────
function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

function pointColor(action, epe) {
  if (action === 'cold_only') return 0x4a4a6a;
  if (epe > 0.5)  return 0xff6b35;
  if (epe > 0.3)  return 0xffd166;
  return 0x06d6a0;
}

function baseRadius(action, epe, tokenCount) {
  const scale = 1 + tokenCount / 500;
  if (action === 'cold_only') return 0.10 * scale;
  if (epe > 0.5)  return 0.12 * scale;
  if (epe > 0.3)  return 0.10 * scale;
  return 0.08 * scale;
}

function spawnPoint(msg) {
  const [x, y, z] = msg.coords_3d;
  const pos = new THREE.Vector3(x, y, z);
  const color = pointColor(msg.action, msg.epe_novelty);
  const r = baseRadius(msg.action, msg.epe_novelty, msg.token_count_original);

  let mesh;
  if (msg.action === 'cold_only') {
    const geo = new THREE.TorusGeometry(r, r * 0.3, 8, 24);
    const mat = new THREE.MeshStandardMaterial({ color, transparent: true, opacity: 0.7 });
    mesh = new THREE.Mesh(geo, mat);
  } else {
    const geo = new THREE.SphereGeometry(r, 16, 12);
    const mat = new THREE.MeshStandardMaterial({ color });
    mesh = new THREE.Mesh(geo, mat);
  }
  mesh.position.copy(pos);
  mesh.scale.set(0, 0, 0);
  scene.add(mesh);

  // arrival animation: scale 0→1 over 400ms
  const t0 = performance.now();
  animations.push(now => {
    const p = Math.min((now - t0) / 400, 1);
    const s = easeOut(p);
    mesh.scale.set(s, s, s);
    return p >= 1;
  });

  // pulse ring: torus expanding and fading over 600ms
  const ringGeo = new THREE.TorusGeometry(0.1, 0.02, 8, 24);
  const ringMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.6 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.copy(pos);
  scene.add(ring);
  const t1 = performance.now();
  animations.push(now => {
    const p = Math.min((now - t1) / 600, 1);
    const s = 1 + p * 4;
    ring.scale.set(s, s, s);
    ringMat.opacity = 0.6 * (1 - p);
    if (p >= 1) { scene.remove(ring); ringGeo.dispose(); ringMat.dispose(); }
    return p >= 1;
  });

  points[msg.seq_id] = { mesh, data: msg, position: pos };
}

// ── WebSocket messages ────────────────────────────────────────────────────────
function handleIngest(msg) {
  totalCount++;
  if (msg.action !== 'cold_only') novelCount++;
  spawnPoint(msg);
}

function handleContradiction(msg) {
  const np = points[msg.new_seq_id];
  const sp = points[msg.stale_seq_id];
  if (!np || !sp) return;

  // dim stale point
  const staleMesh = sp.mesh;
  const t0 = performance.now();
  animations.push(now => {
    const p = Math.min((now - t0) / 1000, 1);
    staleMesh.material.color.setHex(0x2a2a2a);
    staleMesh.material.transparent = true;
    staleMesh.material.opacity = 1 - p * 0.8;
    return p >= 1;
  });

  // red tube between the two points
  const dir = new THREE.Vector3().subVectors(sp.position, np.position);
  const len = dir.length();
  const mid = new THREE.Vector3().addVectors(np.position, sp.position).multiplyScalar(0.5);
  const path = new THREE.LineCurve3(np.position.clone(), sp.position.clone());
  const tubeGeo = new THREE.TubeGeometry(path, 4, 0.015, 6, false);
  const tubeMat = new THREE.MeshBasicMaterial({ color: 0xff4444, transparent: true, opacity: 0 });
  const tube = new THREE.Mesh(tubeGeo, tubeMat);
  scene.add(tube);

  const t1 = performance.now();
  animations.push(now => {
    const p = Math.min((now - t1) / 300, 1);
    tubeMat.opacity = p;
    return p >= 1;
  });

  // fade tube out after 2 seconds
  const t2 = performance.now() + 2000;
  animations.push(now => {
    if (now < t2) return false;
    const p = Math.min((now - t2) / 500, 1);
    tubeMat.opacity = 1 - p;
    if (p >= 1) { scene.remove(tube); tubeGeo.dispose(); tubeMat.dispose(); }
    return p >= 1;
  });
}

function handleRetrieval(msg) {
  // show result text
  const box = document.getElementById('query-result');
  const textEl = document.getElementById('qr-text');
  const typeEl = document.getElementById('qr-type');
  textEl.textContent = msg.result_text || '(no result)';
  typeEl.textContent = msg.query_type || '';
  box.style.display = 'block';
  // auto-hide after 12 seconds
  clearTimeout(box._hideTimer);
  box._hideTimer = setTimeout(() => { box.style.display = 'none'; }, 12000);

  // pulse matching points in 3D space
  (msg.result_seq_ids || []).forEach(sid => {
    const p = points[sid];
    if (!p) return;
    let rep = 0;
    function pulse() {
      if (rep >= 2) return;
      rep++;
      const rg = new THREE.TorusGeometry(0.12, 0.02, 8, 24);
      const rm = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
      const ring = new THREE.Mesh(rg, rm);
      ring.position.copy(p.position);
      scene.add(ring);
      const t0 = performance.now();
      animations.push(now => {
        const prog = Math.min((now - t0) / 1500, 1);
        const s = 1 + prog * 5;
        ring.scale.set(s, s, s);
        rm.opacity = 0.8 * (1 - prog);
        if (prog >= 1) {
          scene.remove(ring); rg.dispose(); rm.dispose();
          pulse();
        }
        return prog >= 1;
      });
    }
    pulse();
  });
}

function updateHUD(msg) {
  document.getElementById('h-hot').textContent =
    `${msg.hot_cache_size} pts / ${msg.hot_cache_tokens} tok`;
  document.getElementById('h-cold').textContent = `${msg.cold_storage_size} total`;
  const pct = totalCount > 0 ? Math.round(novelCount / totalCount * 100) : 0;
  document.getElementById('h-novel').textContent = `${pct}%`;
  document.getElementById('h-session').textContent = (msg.session_id || '').slice(0, 18);
}

// ── click-to-inspect ──────────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

renderer.domElement.addEventListener('mousedown', e => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  const meshList = Object.values(points).map(p => p.mesh);
  const hits = raycaster.intersectObjects(meshList);
  if (hits.length > 0) {
    const hitMesh = hits[0].object;
    const entry = Object.values(points).find(p => p.mesh === hitMesh);
    if (entry) showInspect(entry.data);
  } else {
    document.getElementById('inspect').style.display = 'none';
  }
});

document.getElementById('inspect-close').addEventListener('click', () => {
  document.getElementById('inspect').style.display = 'none';
});

function showInspect(d) {
  const txt = [
    `seq_id: ${d.seq_id}`,
    `content_type: ${d.content_type}`,
    `action: ${d.action}`,
    `epe_novelty: ${d.epe_novelty.toFixed(3)}`,
    `budget: ${Math.round(d.budget * 100)}%`,
    `anchors: ${(d.anchors || []).join(', ') || 'none'}`,
    '',
    'ORIGINAL (first 200 chars):',
    (d.original_tokens || []).map(t => t.text).join(' ').slice(0, 200),
  ].join('\n');
  document.getElementById('inspect-content').textContent = txt;
  document.getElementById('inspect').style.display = 'block';
}

// ── retrieval input ───────────────────────────────────────────────────────────
const ws = new WebSocket(`ws://${location.host}/ws`);
ws.onmessage = e => {
  const msg = JSON.parse(e.data);
  if (msg.type === 'segment_ingest')  handleIngest(msg);
  if (msg.type === 'contradiction')   handleContradiction(msg);
  if (msg.type === 'retrieval')       handleRetrieval(msg);
  if (msg.type === 'session_stats')   updateHUD(msg);
};

function sendQuery() {
  const q = document.getElementById('query-input').value.trim();
  if (q && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'retrieve', query: q }));
  }
}
document.getElementById('query-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendQuery();
});
</script>
</body>
</html>
