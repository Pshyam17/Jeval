[build-system]
requires = ["setuptools>=65.5.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jeval"
version = "0.1.0"
description = "JEPA-based semantic fidelity compressor for agent memory"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Preethi", email = "you@example.com" }
]
keywords = ["semantic compression", "agent memory", "EPE", "JEPA", "nlp", "transformers"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

dependencies = [
  "numpy>=1.26",
  "transformers>=4.35",
  "sentence-transformers>=2.2",
  "torch>=2.1",
  "scikit-learn>=1.3",
  "accelerate>=0.24",
  "pyyaml>=6.0",
  "typer>=0.10",
  "python-dotenv>=1.0",
  "loguru>=0.7",
]

[project.urls]
"Homepage" = "https://github.com/your-org/jeval"
"Repository" = "https://github.com/your-org/jeval"
"Documentation" = "https://github.com/your-org/jeval#readme"

[project.optional-dependencies]
dev = ["black", "ruff", "isort", "mypy", "pre-commit"]

[tool.setuptools.packages.find]
where = ["jeval"]
exclude = ["tests*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--strict-markers --tb=short --cov=jeval"
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "TAE", "C90"]

[tool.isort]
profile = "black"
